[package]
name = "netekg"
version = "0.1.0"
edition = "2024"
description = "Vital signs of your internet connection in the terminal: speed, ping, jitter, packet loss, live traffic and Wi-Fi"
license = "GPL-3.0-or-later"
repository = "https://github.com/karai32/netekg"
readme = "README.md"
keywords = ["network", "speedtest", "ping", "tui", "terminal"]
categories = ["command-line-utilities", "network-programming"]
exclude = ["docs/"]

[dependencies]
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
socket2 = { version = "0.6", features = ["all"] }

# The system TLS stack on Windows and macOS, a bundled one elsewhere.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
native-tls = "0.2"

[target.'cfg(not(any(windows, target_os = "macos")))'.dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WiFi",
    "Win32_Networking_WinSock",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
